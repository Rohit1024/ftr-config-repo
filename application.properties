# Expose management endpoints for sanity validation
management.endpoints.web.exposure.include=health,info
server.port=8080

# ==========================================
# 1. PostgreSQL Configuration
# ==========================================
spring.datasource.url=${JDBC_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. HikariCP Connection Pool Tuning
# ==========================================
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# 3. Hibernate / JPA Settings
# ==========================================
# Let Hibernate 6 auto-detect the exact Postgres version dialect automatically.
# Only keep this line if you are on Spring Boot 2.x and need a strict version (e.g., PostgreSQL10Dialect)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create

# ==========================================
# 4. Microservices URLs
# ==========================================
services.user-profile.url=https://user-profile-946235692612.asia-south1.run.app
services.terminal.url=https://terminals-946235692612.asia-south1.run.app
services.vehicles.url=https://vehicles-946235692612.asia-south1.run.app
services.workitems.url=https://workitems-946235692612.asia-south1.run.app

# ==========================================
# 5. Gateway URL
# ==========================================
services.gateway.url=https://gateway-946235692612.asia-south1.run.app
