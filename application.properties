# ==========================================
# 1. Google Cloud SQL Configuration (Shared)
# ==========================================
spring.cloud.gcp.sql.database-name=ftr-db
spring.cloud.gcp.sql.instance-connection-name=sidekick-1024:us-central1:sidekick-1024-instance
spring.cloud.gcp.sql.ip-types=PUBLIC
spring.cloud.gcp.sql.enable-iam-auth=true
spring.datasource.username=toolbox-identity@sidekick-1024.iam

# ==========================================
# 2. HikariCP Connection Pool Tuning (Shared)
# ==========================================
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# 3. Hibernate / JPA Settings (Shared)
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# 4. Microservices URLs
# ==========================================
services.user-profile.url=${USER_PROFILE_URL}
services.terminal.url=${TERMINAL_URL}
services.vehicles.url=${VEHICLES_URL}
services.workitems.url=${WORKITEMS_URL}
