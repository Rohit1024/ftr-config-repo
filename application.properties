# ==========================================
# 1. Google Cloud SQL Configuration (Shared)
# ==========================================
spring.cloud.gcp.sql.database-name=${DATABASE_NAME}
spring.cloud.gcp.sql.instance-connection-name=${INSTANCE_CONNECTION_NAME}
spring.cloud.gcp.sql.ip-types=PRIVATE
spring.cloud.gcp.sql.enable-iam-auth=true
spring.datasource.username=${IAM_DB_USER}

# ==========================================
# 2. HikariCP Connection Pool Tuning (Shared)
# ==========================================
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# 3. Hibernate / JPA Settings (Shared)
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

